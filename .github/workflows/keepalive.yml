name: Keep Alive

on:
  schedule:
    - cron: '0 10 15 * *'   # Her ayın 15'i, saat 10:00 UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Tarih damgası güncelle
        run: |
          echo "Son keepalive: $(date -u '+%Y-%m-%d %H:%M UTC')" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "chore: keepalive $(date -u +%Y-%m)"
          git push

      - name: Deprem workflow'u aktive et
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ta2cay/baktrad-cron/actions/workflows/deprem.yml/enable"
          echo "Deprem workflow etkinlestirildi"
